[project]
name = "eddy-irasetsa-rl-summative"
version = "0.1.0"
description = "FetalScanNav: RL probe guidance for fetal ultrasound standard planes (DQN, REINFORCE, PPO, A2C with TorchRL)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium>=1.0,<1.3",
    "numpy>=1.26,<3",
    "torch==2.7.1",
    "torchrl==0.9.2",
    "tensordict==0.9.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "rich>=13.7",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
